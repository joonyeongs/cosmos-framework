# Generator full fine-tuning on the 200 successful RoboLab demonstrations (all used for training).
# Same data, batch, AC/compile and schedule as robolab_droid_edge_lora.toml; trains every
# surviving generator-side weight instead of LoRA adapters. Launch with
#   COSMOS_DROID_TOML=examples/toml/sft_config/robolab_droid_edge_full.toml bash examples/launch_robolab_droid_lora.sh
[job]
task = "vfm"
experiment = "robolab_droid_edge_full"
project = "robolab"
group = "cosmos3_droid_edge_full"
name = "eight_tasks"
wandb_mode = "disabled"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree = 2
data_parallel_replicate_degree = 1

# Selective AC keeps attention outputs and recomputes the rest. save_ops_regex is
# deliberately left unset: the framework default covers flash2/flash3/FMHA ops,
# whereas the TOML-schema default ["fmha"] matches nothing on A100 flash2.
# Measured on 2x A100-80GB (at global batch 128): 55.8 -> 46.1 s/step together with
# compile below; peak ~43 GiB allocated per GPU.
[model.activation_checkpointing]
mode = "selective"

# Compiles the language/generator backbone only (compiled_region = "language");
# the VAE encoder keeps its separately validated norm-only compilation.
[model.compile]
enabled = true

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

# Full-weight lr (RoboCasa Edge SFT peak); 1e-4 is the adapter lr.
[optimizer]
lr = 2.0e-5

# 2,000 optimizer steps: 100-step linear warmup (f_start -> f_max = 1.0, i.e. lr 2e-5),
# then linear decay to 0 at step 2,000. cycle_lengths includes the warmup steps.
[scheduler]
cycle_lengths = [2000]
warm_up_steps = [100]
f_start = [1.0e-6]
f_max = [1.0]
f_min = [0.0]

[dataloader_train]
max_samples_per_batch = 32

[trainer]
max_iter = 2000
grad_accum_iter = 1  # global batch 64 = 32/GPU x 2 GPUs x 1
logging_iter = 1

[checkpoint]
save_iter = 250
